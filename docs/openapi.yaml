openapi: 3.1.0
info:
  title: Provider Intelligence Platform API
  version: 1.0.0
  description: >-
    Provider search, MIPS performance, hospital quality, and exclusion
    screening over free public government healthcare data (NPI Registry,
    CMS QPP Experience, Care Compare, OIG LEIE, state Medicaid exclusion
    lists). All GET endpoints are open (public-data posture); all non-GET
    endpoints require an X-API-Key header, as does /api/v1/admin/usage.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /providers/search:
    get:
      summary: Search providers
      parameters:
        - { name: terms, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string, pattern: '^[A-Za-z]{2}$' } }
        - { name: city, in: query, schema: { type: string } }
        - { name: taxonomy, in: query, schema: { type: string } }
        - { name: maxResults, in: query, schema: { type: integer, default: 50, minimum: 1, maximum: 500 } }
        - { name: offset, in: query, schema: { type: integer, default: 0, minimum: 0 }, description: offset + maxResults must not exceed 7500 (upstream limit) }
        - name: format
          in: query
          schema: { type: string, enum: [csv] }
          description: >-
            When 'csv', returns text/csv (attachment filename provider-search.csv)
            instead of JSON. Header row: npi, name, credential, taxonomy_code,
            taxonomy_description, city, state, zip, phone (snake_case; always
            emitted, even for empty results)
      responses:
        '200': { description: '{ success, data, count, total, offset, limit } — total is the upstream match count' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /providers/{npi}:
    get:
      summary: Provider detail by NPI
      parameters:
        - { name: npi, in: path, required: true, schema: { type: string, pattern: '^\d{10}$' } }
        - { name: includeMips, in: query, schema: { type: string, enum: ['true'] } }
      responses:
        '200': { description: Provider identity plus optional mipsPerformance }
        '404': { $ref: '#/components/responses/NotFound' }
  /providers/{npi}/verification:
    get:
      summary: Verification dossier (identity, exclusion, performance, flags)
      parameters:
        - { $ref: '#/components/parameters/Npi' }
      responses:
        '200':
          description: >-
            '{ npi, identity, licenses, exclusion, performance, flagsSummary,
            terms }'. The licenses block lists every license the provider
            self-reported to NPPES; each value carries source and as-of
            provenance. Licenses are self-reported data, not verified board
            statuses, and the block carries a note saying so. When an
            ingested state board row matches (issuing state, license number),
            the license also carries a 'verified' block:
            '{ status, expirationDate, disciplinaryStatus, source, asOf }',
            where the first three are provenance-wrapped values from the
            board feed (Texas Medical Board or Colorado DORA) and source/asOf
            cite the board dataset and its load date. Licenses without a
            board match have no 'verified' key.
  /providers/{npi}/mips-performance:
    get:
      summary: MIPS performance for one NPI and year
      parameters:
        - { $ref: '#/components/parameters/Npi' }
        - { name: year, in: query, schema: { type: integer } }
        - name: format
          in: query
          schema: { type: string, enum: [csv] }
          description: >-
            When 'csv', ignores `year` and returns one row per cached year in
            the startYear..endYear range as text/csv (attachment filename
            mips-performance-{npi}.csv). Header row: performance_year,
            final_score, quality_score, improvement_activities_score,
            promoting_interoperability_score, cost_score, performance_status,
            data_source, year_source (archive vs rolling, so request-labeled
            rolling rows are distinguishable from archived per-year vintages;
            header always emitted, even with no rows)
        - { name: startYear, in: query, schema: { type: integer, default: 2018 }, description: CSV export only }
        - { name: endYear, in: query, schema: { type: integer }, description: CSV export only; defaults to the previous calendar year }
      responses:
        '200': { description: MIPS score object or null data when unscored }
  /providers/{npi}/mips-trends:
    get:
      summary: Multi-year MIPS trend
      parameters:
        - { $ref: '#/components/parameters/Npi' }
        - { name: startYear, in: query, schema: { type: integer, default: 2018 } }
        - { name: endYear, in: query, schema: { type: integer } }
      responses:
        '200': { description: '{ npi, trends, analysis }' }
  /quality-measures/{facilityId}:
    get:
      summary: Hospital quality measures with national comparison
      parameters:
        - { name: facilityId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string, default: 'all' } }
      responses:
        '200': { description: Quality measure rows for the facility }
  /analytics/group-performance:
    get:
      summary: Group MIPS statistics for up to 100 NPIs
      parameters:
        - { name: npis, in: query, required: true, schema: { type: string }, description: Comma-separated NPIs (max 100) }
        - { name: year, in: query, required: true, schema: { type: integer } }
      responses:
        '200': { description: Aggregate group statistics }
        '400': { $ref: '#/components/responses/BadRequest' }
  /analytics/ranking/{npi}:
    get:
      summary: Provider rank/percentile vs peers
      parameters:
        - { $ref: '#/components/parameters/Npi' }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: taxonomy, in: query, schema: { type: string } }
      responses:
        '200': { description: Ranking with null rank for unscored targets }
  /analytics/trends/{npi}:
    get:
      summary: Multi-year MIPS scores with trend analysis and rolling-vintage warning
      parameters:
        - { $ref: '#/components/parameters/Npi' }
        - { name: startYear, in: query, schema: { type: integer } }
        - { name: endYear, in: query, schema: { type: integer } }
  /analytics/benchmark/{npi}:
    get:
      summary: Provider score vs national average and quartiles
      parameters:
        - { $ref: '#/components/parameters/Npi' }
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: taxonomy, in: query, schema: { type: string } }
  /analytics/taxonomy-benchmark:
    get:
      summary: Per-taxonomy peer benchmark report for one archive year
      description: >-
        Story 4.1. Distribution summary (scored_count, mean, min/max, and
        p25/p50/p75 quartiles) is read from the materialized
        taxonomy_percentiles table for the requested taxonomy-year; the
        decile ladder (d10..d90) and the per-state breakdown are computed
        at read time with PERCENTILE_CONT (linear interpolation) over
        scored archive MIPS rows (year_source='archive') whose resolved
        taxonomy matches, using the materializer's coalesce order:
        nppes_providers.primary_taxonomy_code first, providers cache as
        fallback. Both params are required; year must be an archive
        performance year (2018-2020, 2022-2024). 404 when the
        taxonomy-year pair is not materialized; 400 when the stored
        cohort exceeds the live-decile guard (250,000 scored rows).
      parameters:
        - { name: taxonomy, in: query, required: true, schema: { type: string, pattern: '^[0-9A-Z]{3,10}$' }, description: NPPES taxonomy code, e.g. 207Q00000X }
        - { name: year, in: query, required: true, schema: { type: integer, enum: [2018, 2019, 2020, 2022, 2023, 2024] } }
      responses:
        '200':
          description: >-
            { success, data: { taxonomy, performance_year, scoredCount,
            mean, deciles: { d10..d90 }, quartiles: { p25, p50, p75 },
            min, max, states: [ { state, scoredCount, median } ],
            provenance: { source, as_of } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: Taxonomy-year pair not materialized }
  /analytics/percentile-trends/{npi}:
    get:
      summary: Provider percentile over time vs their taxonomy cohort (archive years)
      description: >-
        One row per archive performance year for the provider's primary
        taxonomy, read from the materialized taxonomy_percentiles table
        (built by tools/build-taxonomy-percentiles.js). The provider's
        taxonomy resolves with the loader's coalesce order:
        nppes_providers.primary_taxonomy_code first, providers cache as
        fallback. Distribution columns (median/p25/p75/scored_count) come
        from taxonomy_percentiles with PERCENTILE_CONT (linear
        interpolation over non-null final scores, same definition as
        group-performance/benchmark). The per-year percentile is computed
        at read time as the exact share of scored same-taxonomy peers
        scoring at or below the provider (100 = best, same definition as
        ranking), because stored quartiles plus scored_count cannot
        reproduce that exact share. Only year_source='archive' rows
        participate; rolling-vintage rows never appear. 404 when the npi
        has no primary taxonomy in either table.
      parameters:
        - { $ref: '#/components/parameters/Npi' }
      responses:
        '200':
          description: >-
            { success, data: { npi, taxonomy, years: [ { performance_year,
            final_score, percentile, median_final_score, p25, p75,
            scored_count, year_source, provenance: { source, as_of } } ] } }
            final_score and percentile are null when the provider has no
            archive score that year.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: No primary taxonomy on record for the npi }
  /intelligence/cohort:
    get:
      summary: Cohort intelligence (cached or national source)
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [cached, national], default: cached } }
        - { name: state, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z]{2}$' } }
        - { name: taxonomy, in: query, schema: { type: string }, description: Cached description substring, or national taxonomy-code prefix when source=national }
        - { name: name, in: query, schema: { type: string }, description: National mode only; space-separated terms matched against entity name }
        - { name: minScore, in: query, schema: { type: number, minimum: 0, maximum: 100 } }
      responses:
        '200':
          description: >-
            Cached mode joins providers + latest MIPS + LEIE verdicts.
            National mode reads the materialized national_screening table and
            adds verdict (EXCLUDED | CLEAR | unscreened) and enrichable.
            Rows are capped at 500.
        '400': { $ref: '#/components/responses/BadRequest' }
  /intelligence/exclusion-watchlist:
    get:
      summary: Recently added, still-active LEIE exclusions
      parameters:
        - { name: state, in: query, schema: { type: string, pattern: '^[A-Za-z]{2}$' } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 90 } }
      responses:
        '200':
          description: >-
            '{ success, data: [{ name, entityType, npi, city, state, zip,
            exclusionType, exclusionDate, source, asOf }], count, windowDays,
            state, capped }'
  /intelligence/screen-roster:
    post:
      summary: Screen a roster of identities against both exclusion registries (API key required)
      security: [{ apiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rows]
              properties:
                rows:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    properties:
                      npi: { type: string }
                      lastname: { type: string }
                      firstname: { type: string }
                      state: { type: string }
                      dob: { type: string }
                      organizationName: { type: string }
      responses:
        '200': { description: '{ success, data: [...], count, counts, submitted, truncated }' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /admin/usage:
    get:
      summary: Per-key and per-endpoint API usage from api_usage (API key required, every method)
      security: [{ apiKey: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        '200':
          description: '{ success, days, byKey: [{ key_label, requests, errors, first_used, last_used }], byEndpoint: [...], capped }'
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Npi:
      name: npi
      in: path
      required: true
      schema: { type: string, pattern: '^\d{10}$' }
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string } } }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { type: object, properties: { error: { type: string, example: 'invalid or missing API key' } } }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { type: object, properties: { success: { type: boolean, example: false }, error: { type: string } } }
